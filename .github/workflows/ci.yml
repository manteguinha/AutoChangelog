name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  qualidade:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Instalar
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Formatação
        run: ruff format --check .
      - name: Testes
        run: pytest

  acao:
    name: GitHub Action
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rodar a Action
        id: changelog
        uses: ./
      - name: Rodar de novo (não deve alterar nada)
        id: repeticao
        uses: ./
      - name: Conferir as saídas
        env:
          ARQUIVO: ${{ steps.changelog.outputs.arquivo }}
          ALTERADO: ${{ steps.repeticao.outputs.alterado }}
        run: |
          test "$ARQUIVO" = "CHANGELOG.md"
          test -f "$ARQUIVO"
          test "$ALTERADO" = "false"
